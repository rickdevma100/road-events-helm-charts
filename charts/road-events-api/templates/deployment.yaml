apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: road-events-api
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: road-events-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: road-events-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: DEVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DEVICE_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DATABASE_URL
            - name: BULB_ADAPTER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_ADAPTER
            - name: BULB_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_IP
            - name: BULB_DEVICE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_DEVICE_ID
            - name: BULB_LOCAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_LOCAL_KEY
            - name: BULB_PROTOCOL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_PROTOCOL
            - name: BULB_BRIGHTNESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BULB_BRIGHTNESS
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: S3_ENDPOINT_URL
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: S3_BUCKET_NAME
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: S3_SECRET_KEY
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: S3_REGION
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SMTP_USER
            - name: ALERT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALERT_ADMIN_EMAIL
            - name: ALERT_RECIPIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALERT_RECIPIENT_EMAIL
            - name: ALERT_EMAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALERT_EMAIL_ENABLED
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if and .Values.smtp.existingSecret .Values.smtp.existingSecret.name }}{{ .Values.smtp.existingSecret.name }}{{ else }}{{ .Release.Name }}-secret{{ end }}
                  key: {{ if and .Values.smtp.existingSecret .Values.smtp.existingSecret.name .Values.smtp.existingSecret.key }}{{ .Values.smtp.existingSecret.key }}{{ else }}SMTP_PASSWORD{{ end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: api-code
              mountPath: /app/app/main.py
              subPath: main.py
            - name: api-code
              mountPath: /app/app/bulb_service.py
              subPath: bulb_service.py
      volumes:
        - name: api-code
          configMap:
            name: road-events-api-code
            optional: true
