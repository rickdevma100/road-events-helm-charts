apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: postgres-postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.auth.database | quote }}
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASS: {{ .Values.auth.password | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  ALLOW_IP_RANGE: "0.0.0.0/0"
