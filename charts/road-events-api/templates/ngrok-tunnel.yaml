{{- if .Values.ngrok.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ngrok
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: road-events-ngrok
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: road-events-ngrok
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: road-events-ngrok
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ngrok
          image: "{{ .Values.ngrok.image.repository }}:{{ .Values.ngrok.image.tag }}"
          imagePullPolicy: {{ .Values.ngrok.image.pullPolicy }}
          args:
            - "http"
            {{- if .Values.ngrok.domain }}
            - "--domain={{ .Values.ngrok.domain }}"
            {{- end }}
            - "{{ .Release.Name }}:{{ .Values.service.port }}"
          env:
            - name: NGROK_AUTHTOKEN
              value: {{ .Values.ngrok.authtoken | quote }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end }}
