apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: road-events-api
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  DEVICE_TOKEN: {{ .Values.config.deviceToken | quote }}
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  BULB_ADAPTER: {{ .Values.config.bulb.adapter | quote }}
  BULB_IP: {{ .Values.config.bulb.ip | quote }}
  BULB_DEVICE_ID: {{ .Values.config.bulb.deviceId | quote }}
  BULB_LOCAL_KEY: {{ .Values.config.bulb.localKey | quote }}
  BULB_PROTOCOL: {{ .Values.config.bulb.protocol | quote }}
  BULB_BRIGHTNESS: {{ .Values.config.bulb.brightness | quote }}
  S3_ENDPOINT_URL: {{ .Values.s3.endpointUrl | quote }}
  S3_BUCKET_NAME: {{ .Values.s3.bucketName | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  SMTP_HOST: {{ .Values.smtp.host | quote }}
  SMTP_PORT: {{ .Values.smtp.port | quote }}
  SMTP_USER: {{ .Values.smtp.user | quote }}
  ALERT_ADMIN_EMAIL: {{ .Values.smtp.adminEmail | quote }}
  ALERT_RECIPIENT_EMAIL: {{ .Values.smtp.recipientEmail | quote }}
  ALERT_EMAIL_ENABLED: {{ .Values.smtp.enabled | quote }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
